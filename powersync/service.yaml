# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# Local PowerSync service (architecture.md section 8). The hosted dev and
# prod instances are configured in the PowerSync dashboard instead.
# Only environment variables starting with PS_ can be read with !env.

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  supabase: true
  # Local Supabase Auth signs tokens with asymmetric keys; kong is the
  # Supabase API gateway on the supabase_network_lymbr Docker network.
  jwks_uri: http://kong:8000/auth/v1/.well-known/jwks.json
  audience: ['authenticated']

healthcheck:
  probes:
    use_http: true
